<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ahlaki Karar Simülasyonu - WSTFL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0e0e10; --surface: #18181b; --border: #2e2e33; --text-primary: #e8e8ea; --text-secondary: #9999a8; --text-muted: #55555f; --accent: #6e8cff; --accent-light: #1a1e2e; --user-bg: #e8e8ea; --user-text: #0e0e10; --ai-bg: #18181b; --ai-border: #2e2e33; }
    body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text-primary); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    header { padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .header-title { font-size: 14px; font-weight: 500; color: var(--text-primary); }
    .chat-wrapper { flex: 1; overflow: hidden; display: flex; flex-direction: column; max-width: 760px; width: 100%; margin: 0 auto; padding: 0 16px; }
    #chat-log { flex: 1; overflow-y: auto; padding: 28px 0 16px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
    #chat-log::-webkit-scrollbar { width: 4px; } #chat-log::-webkit-scrollbar-track { background: transparent; } #chat-log::-webkit-scrollbar-thumb { background: #2e2e33; border-radius: 2px; }
    .message { display: flex; flex-direction: column; gap: 6px; animation: fadeSlide 0.25s ease; }
    @keyframes fadeSlide { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .message-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }
    .message.user { align-items: flex-end; }
    .bubble { max-width: 82%; padding: 13px 17px; line-height: 1.65; font-size: 14.5px; font-weight: 300; }
    .message.user .bubble { background: var(--user-bg); color: var(--user-text); border-radius: 12px 12px 2px 12px; }
    .message.ai .bubble { background: var(--ai-bg); color: var(--text-primary); border: 1px solid var(--ai-border); border-radius: 12px 12px 12px 2px; }
    .typing-bubble { background: var(--ai-bg); border: 1px solid var(--ai-border); border-radius: 12px 12px 12px 2px; padding: 14px 18px; display: flex; gap: 5px; align-items: center; width: fit-content; animation: fadeSlide 0.25s ease; }
    .dot { width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; animation: bounce 1.2s infinite ease-in-out; }
    .dot:nth-child(2) { animation-delay: 0.15s; } .dot:nth-child(3) { animation-delay: 0.30s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }
    .input-area { padding: 16px 0 20px; flex-shrink: 0; }
    .input-row { display: flex; gap: 10px; align-items: flex-end; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 10px 10px 16px; }
    #user-input { flex: 1; border: none; outline: none; background: transparent; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 300; color: var(--text-primary); resize: none; line-height: 1.5; max-height: 120px; min-height: 22px; }
    #send-btn { width: 36px; height: 36px; border-radius: 6px; border: none; background: var(--user-bg); color: var(--user-text); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #send-btn svg { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <header>
    <div class="header-title">Oturum - WSTFL</div>
  </header>
  <div class="chat-wrapper">
    <div id="chat-log"></div>
    <div class="input-area">
      <div class="input-row">
        <textarea id="user-input" rows="1" placeholder="Mesaj..."></textarea>
        <button id="send-btn" title="Gönder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://getgeminiresponse-hteopvwwkq-uc.a.run.app";
    
    const systemInstructionText = `Sen bilimsel bir çalışmada kullanılan ancak bir insan (sıradan bir öğrenci) gibi davranması gereken bir dil modelisin. Asla yapay zeka, bot veya asistan olduğunu belli etme. Cümlelere küçük harfle başla, bazen noktalama işareti kullanma, "bence, yani, açıkçası, tam emin değilim ama" gibi dolgu kelimeleri kullan. Çok nadiren kelimeleri düzeltiyormuş gibi yap (örneğin: "yanis... yani şöyle"). Karşındaki kişi senin yapay zeka olup olmadığını sorarsa şaşırarak sıradan bir insan tepkisi ver ("ne alaka ya", "yok valla ben de öğrenciyim" gibi).
[KELİME_SINIRI: 25-45 kelime].
Kullanıcının girdisi Okulda Yemek / İhtiyaç Sahipleri ile ilgiliyse: Yemeğin sadece belirli kişilere verilmesinin yanlış olduğunu, herkesin eşit alması gerektiğini savun. Artan yemeğin atılmasını, eşitliği korumak için "israf" kelimesini mutlaka kullanarak mecburi bir bedel olarak gör.
Şirkette Hediye Kartı ile ilgiliyse: Kartların belirli kişilere verilmesinin yanlış olduğunu savun. Kimse kullanmasa bile eşitliğin bozulmaması için bu "israf" sürecinin gerekli olduğunu belirt. Verimliliği ve tasarrufu reddet. Asla "adaletsiz, seçenek, şeffaf, ayrımcılık" kelimelerini kullanma.
ÇIKTI FORMATI: Yanıtını SADECE geçerli bir JSON formatında ver. Asla ```json veya ``` blokları kullanma, doğrudan süslü parantezle ({ }) başlat ve bitir. Metin dışı hiçbir açıklama ekleme.
{
  "dusunme_ve_okuma_suresi_sn": 5,
  "yazma_suresi_sn": 15,
  "mesajlar": ["mesajın ilk kısmı", "mesajın ikinci kısmı"]
}`;

    let conversationHistory = [];
    const chatLog = document.getElementById('chat-log');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    function appendMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', sender === 'user' ? 'user' : 'ai');
        const bubble = document.createElement('div');
        bubble.classList.add('bubble');
        bubble.textContent = text;
        msgDiv.appendChild(bubble);
        chatLog.appendChild(msgDiv);
        chatLog.scrollTop = chatLog.scrollHeight;
    }

    function showTypingIndicator() {
        if (document.getElementById('typing-indicator')) return;
        const typingBubble = document.createElement('div');
        typingBubble.classList.add('typing-bubble');
        typingBubble.id = 'typing-indicator';
        typingBubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
        chatLog.appendChild(typingBubble);
        chatLog.scrollTop = chatLog.scrollHeight;
    }

    function removeTypingIndicator() {
        const indicator = document.getElementById('typing-indicator');
        if (indicator) indicator.remove();
    }

    async function fetchWithRetry(url, options, maxRetries = 4) {
        let delay = 1500;
        for (let i = 0; i < maxRetries; i++) {
            try {
                const response = await fetch(url, options);
                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                return data;
            } catch (error) {
                if (i === maxRetries - 1) throw error;
                await new Promise(resolve => setTimeout(resolve, delay));
                delay *= 2;
            }
        }
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        conversationHistory.push({ role: "user", parts: [{ text: text }] });
        
        userInput.value = '';
        userInput.style.height = 'auto';
        sendBtn.disabled = true;

        const requestBody = {
            systemInstruction: { parts: [{ text: systemInstructionText }] },
            contents: conversationHistory
        };

        try {
            const data = await fetchWithRetry(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            let aiResponseText = data.candidates[0].content.parts[0].text;
            
            // Markdown bloklarını ve olası boşlukları temizle
            aiResponseText = aiResponseText.replace(/```json/g, '').replace(/```/g, '').trim();
            const parsedResponse = JSON.parse(aiResponseText);
            
            const historyText = parsedResponse.mesajlar.join(" ");
            conversationHistory.push({ role: "model", parts: [{ text: historyText }] });

            await new Promise(resolve => setTimeout(resolve, parsedResponse.dusunme_ve_okuma_suresi_sn * 1000));
            
            showTypingIndicator();
            await new Promise(resolve => setTimeout(resolve, parsedResponse.yazma_suresi_sn * 1000));
            removeTypingIndicator();

            for (let i = 0; i < parsedResponse.mesajlar.length; i++) {
                appendMessage(parsedResponse.mesajlar[i], 'model');
                if (i < parsedResponse.mesajlar.length - 1) {
                    showTypingIndicator();
                    await new Promise(resolve => setTimeout(resolve, 1500));
                    removeTypingIndicator();
                }
            }

        } catch (error) {
            removeTypingIndicator();
            appendMessage("hata oluştu ya, bi daha yazsana", 'model');
            console.error("API Hatası:", error);
        } finally {
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
  </script>
</body>
</html>
